### OUTPUT OPTIONS
#  -OX Display table indexes in a more "program like" output
extendedIndex yes

# Toggles  whether  to  show  errors  encountered  when parsing MIB files.
# -Pe
showMibErrors yes

# Specifies  where  to  break up the output of hexadecimal strings.
# Set to 0 to disable line breaks.
# --hexOutputLength=0
hexOutputLength 0

# MIB HANDLING
mibdirs /usr/share/snmp/mibs

mibs ALL

